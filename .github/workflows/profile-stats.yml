name: Refresh profile stats

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - tests/test_profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test card generation
        run: python -m unittest discover -s tests -v
      - name: Generate public stats cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Publish cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/github-stats.svg Assets/top-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh GitHub profile stats'
          git push origin HEAD:main
